<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Mastery — Responsive Test</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-6 px-4 flex flex-col justify-between">

  <!-- Kengaytirilgan asosiy konteyner -->
  <div class="max-w-6xl w-full mx-auto">
    <!-- Sarlavha -->
    <header class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-amber-400 mb-1">JavaScript Mastery Testi</h1>
      <p class="text-slate-400 text-sm">1-3 darslar bo'yicha interaktiv test</p>
    </header>

    <!-- Dastlabki Yuklanish Spinneri -->
    <div id="initial-loading" class="text-center py-20 bg-slate-800 rounded-2xl border border-slate-700 shadow-xl max-w-xl mx-auto">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-amber-400 border-t-transparent mb-4"></div>
      <p class="text-slate-300 font-medium">Savollar yuklanmoqda...</p>
    </div>

    <!-- Responsive Test Konteyneri: mobilda flex-col, lg da grid yonma-yon -->
    <div id="quiz-container" class="hidden flex flex-col lg:grid lg:grid-cols-12 gap-6 items-start">
      
      <!-- 1. SAVOLLAR RO'YXATI (Katakchalar paneli) -->
      <!-- Mobilda: order-2 (savolning tagida); lg ekranda: order-1 (chap tomonda 4 ustun) -->
      <aside class="w-full order-2 lg:order-1 lg:col-span-4 bg-slate-800/90 rounded-2xl p-5 border border-slate-700/80 shadow-lg lg:sticky lg:top-6">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">Savollar ro'yxati</span>
          <span id="answered-count" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-700 text-amber-400">
            0 / 0 bajarildi
          </span>
        </div>
        <!-- Katakchalar gridi -->
        <div id="pagination-grid" class="grid grid-cols-6 sm:grid-cols-10 lg:grid-cols-5 gap-2"></div>
      </aside>

      <!-- 2. SAVOL KO'RSATILADIGAN ASOSIY QISM -->
      <!-- Mobilda: order-1 (ro'yxatning tepasida); lg ekranda: order-2 (o'ng tomonda 8 ustun) -->
      <main class="w-full order-1 lg:order-2 lg:col-span-8 bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-700">
        <div id="single-question-area"></div>

        <!-- Boshqaruv Tugmalari -->
        <div class="mt-8 pt-6 border-t border-slate-700/80 flex flex-wrap justify-between items-center gap-3">
          <button id="prev-btn" onclick="prevQuestion()" class="px-5 py-2.5 rounded-xl border border-slate-600 bg-slate-700 hover:bg-slate-600 font-medium text-sm transition disabled:opacity-40 disabled:cursor-not-allowed">
            &larr; Oldingi
          </button>

          <div class="flex items-center gap-2">
            <button id="next-btn" onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl border border-slate-600 bg-slate-700 hover:bg-slate-600 font-medium text-sm transition">
              Keyingi &rarr;
            </button>
            <button id="submit-btn" onclick="submitQuiz()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm transition shadow-md hover:shadow-amber-500/20">
              Yakunlash
            </button>
          </div>
        </div>
      </main>

    </div>

    <!-- Tekshirish Spinneri -->
    <div id="checking-loading" class="hidden text-center py-20 bg-slate-800 rounded-2xl border border-slate-700 max-w-xl mx-auto">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-amber-400 border-t-transparent mb-4"></div>
      <p class="text-slate-300 font-medium">Javoblaringiz serverda tekshirilmoqda...</p>
    </div>

    <!-- Natija Oynasi -->
    <div id="result-modal" class="hidden bg-slate-800 rounded-2xl p-8 shadow-2xl border border-amber-500/30 text-center space-y-6 max-w-md mx-auto">
      <h2 class="text-2xl font-bold text-slate-100">Test Natijasi</h2>
      <div class="inline-flex items-center justify-center w-32 h-32 rounded-full bg-slate-900 border-4 border-amber-400 shadow-inner">
        <span id="score-percentage" class="text-3xl font-black text-amber-400">0%</span>
      </div>
      <p id="score-text" class="text-lg text-slate-300 font-medium"></p>
      
      <button onclick="location.reload()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 px-6 rounded-xl transition">
        Qayta topshirish
      </button>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmx1k5hqCtvH36-v8gTXv2fRDE9QjSJvFIcMrlEZQ4-pIINfeDWPw_LgUQLVeMhv-r/exec";

    let questionsData = [];
    const userAnswers = {};
    let currentIndex = 0;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function fetchQuestions() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (data.status === "success" && data.questions) {
          questionsData = shuffleArray(data.questions).map(q => ({
            ...q,
            shuffledOptions: shuffleArray(Object.entries(q.options))
          }));
          
          document.getElementById("initial-loading").classList.add("hidden");
          document.getElementById("quiz-container").classList.remove("hidden");
          
          renderPaginationGrid();
          showQuestion(0);
        } else {
          alert("Savollarni yuklashda xatolik yuz berdi.");
        }
      } catch (error) {
        console.error(error);
        alert("Server bilan bog'lanib bo'lmadi.");
      }
    }

    function renderPaginationGrid() {
      const grid = document.getElementById("pagination-grid");
      grid.innerHTML = questionsData.map((q, idx) => {
        const isAnswered = userAnswers[q.id] !== undefined;
        const isCurrent = idx === currentIndex;

        let styleClass = "bg-slate-700/50 text-slate-400 border-slate-700";

        if (isAnswered) {
          styleClass = "bg-emerald-600/30 text-emerald-300 border-emerald-500/70 shadow-sm shadow-emerald-950 font-bold";
        }

        if (isCurrent) {
          styleClass += " ring-2 ring-amber-400 border-amber-400 text-amber-300 font-extrabold scale-105";
        }

        return `
          <button 
            type="button" 
            onclick="jumpToQuestion(${idx})"
            class="h-9 rounded-lg border text-xs sm:text-sm flex items-center justify-center transition duration-150 cursor-pointer ${styleClass}">
            ${idx + 1}
          </button>
        `;
      }).join('');

      const count = Object.keys(userAnswers).length;
      document.getElementById("answered-count").innerText = `${count} / ${questionsData.length} bajarildi`;
    }

    function showQuestion(index) {
      if (index < 0 || index >= questionsData.length) return;
      currentIndex = index;

      const q = questionsData[currentIndex];
      const cleanQuestionText = q.text.replace(/^\d+\.\s*/, '');
      const container = document.getElementById("single-question-area");

      container.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs font-semibold px-2.5 py-1 rounded bg-amber-400/10 text-amber-400 border border-amber-400/20">
            Savol ${currentIndex + 1} / ${questionsData.length}
          </span>
          ${userAnswers[q.id] ? '<span class="text-xs text-emerald-400 font-medium">✓ Belgilandi</span>' : '<span class="text-xs text-slate-500">Belgilanmagan</span>'}
        </div>

        <p class="font-semibold text-lg sm:text-xl text-slate-100 mb-6 leading-relaxed">
          ${cleanQuestionText}
        </p>

        <div class="grid grid-cols-1 gap-3">
          ${q.shuffledOptions.map(([key, val]) => {
            const isChecked = userAnswers[q.id] === key;
            const checkedStyles = isChecked 
              ? 'border-amber-500 bg-amber-500/10 text-slate-100 ring-1 ring-amber-400/50' 
              : 'border-slate-700 bg-slate-900/60 hover:bg-slate-700/50 text-slate-300';

            return `
              <label class="flex items-center space-x-3 p-4 rounded-xl cursor-pointer transition border ${checkedStyles}">
                <input 
                  type="radio" 
                  name="question-${q.id}" 
                  value="${key}" 
                  ${isChecked ? 'checked' : ''}
                  onchange="selectAnswer(${q.id}, '${key}')" 
                  class="w-4 h-4 text-amber-500 focus:ring-amber-400 border-slate-600 bg-slate-900">
                <span class="text-sm sm:text-base leading-snug">
                  <strong class="text-amber-400 font-bold mr-1.5">${key})</strong> ${val}
                </span>
              </label>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById("prev-btn").disabled = (currentIndex === 0);
      document.getElementById("next-btn").disabled = (currentIndex === questionsData.length - 1);

      renderPaginationGrid();
    }

    function selectAnswer(questionId, optionKey) {
      userAnswers[questionId] = optionKey;
      showQuestion(currentIndex);
    }

    function jumpToQuestion(index) {
      showQuestion(index);
    }

    function nextQuestion() {
      if (currentIndex < questionsData.length - 1) {
        showQuestion(currentIndex + 1);
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        showQuestion(currentIndex - 1);
      }
    }

    async function submitQuiz() {
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < questionsData.length) {
        const proceed = confirm(`Siz ${questionsData.length} ta savoldan ${answeredCount} tasiga javob berdingiz. Testni rostdan ham yakunlamoqchimisiz?`);
        if (!proceed) return;
      }

      document.getElementById("quiz-container").classList.add("hidden");
      document.getElementById("checking-loading").classList.remove("hidden");

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ answers: userAnswers })
        });

        const result = await response.json();

        document.getElementById("checking-loading").classList.add("hidden");
        document.getElementById("result-modal").classList.remove("hidden");

        if (result.status === "success") {
          document.getElementById("score-percentage").innerText = `${result.percentage}%`;
          document.getElementById("score-text").innerText = 
            `Siz ${result.total} ta savoldan ${result.score} tasiga to'g'ri javob berdingiz.`;
        } else {
          alert("Xatolik: " + result.message);
        }

      } catch (error) {
        document.getElementById("checking-loading").classList.add("hidden");
        alert("Server bilan aloqada xatolik yuz berdi.");
        console.error(error);
      }
    }

    window.addEventListener("DOMContentLoaded", fetchQuestions);
  </script>
</body>
</html>
